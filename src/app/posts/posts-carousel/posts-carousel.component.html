<div class="events-content" itemscope itemtype="https://schema.org/Article">
  <meta itemprop="publisher" [attr.content]="ownerName" />
  <meta itemprop="author" [attr.content]="ownerName" />
  <ol [ngClass]="{'partial': _posts.length < 3 && currentPage >= (_originalPosts.length / resultsPerPage)}">
    @for (post of _posts; track post) {
      <li animate.enter="fade-in" itemprop="techArticle" itemscope itemtype="https://schema.org/TechArticle">
        <div class="card" itemprop="item">
          <a href="{{ post.http }}" rel="nofollow" target="_blank" itemprop="url">
            <div class="thumbnail" [style.backgroundImage]="'url('+post.thumbnail+')'">
              <meta itemprop="thumbnailUrl" content="{{ post.thumbnail }}" />
              <meta itemprop="image" content="{{ post.thumbnail }}" />
              <span class="date" itemprop="datePublished">{{ post.date | safariDateFormatter | localizedDate:'MMM yyyy' }}</span>
            </div>
            <div class="content">
              <meta itemprop="author" [attr.content]="ownerName" />
              <meta itemprop="creator" [attr.content]="ownerName" />
              <meta itemprop="publisher" [attr.content]="ownerName" />
              <h2 class="title" appInternationalization [data]="post.internationalizations" property='title' itemprop="name" itemprop="headline">Loading...</h2>
              <p class="description" appInternationalization [data]="post.internationalizations" property='description' [ellipsis]="275" itemprop="description">Loading...</p>
            </div>
            <button class="read-more" i18n="posts@@readMore">Read more</button>
          </a>
        </div>
      </li>
    }
  </ol>
  <p class="paginator">
    <span class="range">
      <span class="start">{{ start + 1 }}</span>
      <span class="devider">-</span>
      <span class="end">{{ end > _originalPosts?.length ? _originalPosts?.length : end }}</span>
    </span>
    <span i18n="posts@@of">of</span>
    <span>{{ _originalPosts?.length }}</span>
    <span class="label" i18n="posts@@postsCountLabel">posts</span>
  </p>
</div>
