# Serves the localized Angular builds at /en/ and /pt/ (their base hrefs).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # Redirect with a relative Location so it stays correct when the container
    # is published on another host port (e.g. -p 8080:80).
    absolute_redirect off;

    # /en and /pt -> /en/ and /pt/
    location ~ ^/(en|pt)$ {
        return 301 /$1/;
    }

    # Files (anything with an extension) must exist; a missing asset is a 404,
    # not the app shell.
    location ~ ^/(en|pt)/.*\.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # Every other path under a locale is an app route: serve that locale's shell.
    # Hash links such as /en/#contact never reach the server.
    location ~ ^/(?<locale>en|pt)/ {
        try_files $uri /$locale/index.html;
    }

    # Nothing is served outside the locale prefixes.
    location / {
        return 404;
    }
}
